# iidp-demo 前端运行配置
#
# 启动方式（先 cd 到本包根目录，prefix 用相对路径 "."，配置里的相对路径都相对该目录）：
#   nginx -p . -c nginx/conf/nginx.conf
# 或直接使用 scripts/mac/start.sh、scripts/windows/start.bat
#
# Windows 注意：不要把含中文的绝对路径传给 -p，该 Windows 版 nginx 会按代码页
# 转换路径并报 1113（ERROR_NO_UNICODE_TRANSLATION）；-p "." 由进程工作目录
# 定位，可正常处理中文目录。
#
# 端口与后端地址如无特殊需要，只改下面 server 块里的 listen 与 proxy_pass 即可。

worker_processes  1;

# 日志与 pid（相对 prefix，即本包根目录）
error_log  logs/error.log  warn;
pid        logs/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log  logs/access.log  main;

    sendfile           on;
    keepalive_timeout  65;
    types_hash_max_size 4096;

    # 前端上传大文件（附件、应用包）需要
    client_max_body_size 500m;

    gzip              on;
    gzip_min_length   1k;
    gzip_comp_level   6;
    gzip_types        text/plain text/css text/xml application/json application/javascript
                      application/xml+rss application/atom+xml image/svg+xml;

    # 临时目录（相对 prefix）
    client_body_temp_path  temp/client_body;
    proxy_temp_path        temp/proxy;
    fastcgi_temp_path      temp/fastcgi;
    uwsgi_temp_path        temp/uwsgi;
    scgi_temp_path         temp/scgi;

    server {
        listen       30666;
        server_name  localhost;

        # 根路径跳转到前端入口
        location = / {
            return 302 /iidp/;
        }

        # ---------- 前端静态资源 ----------
        # 前端资源前缀为 /iidp/，产物根目录是 dist/，SPA 路由回退到 index.html
        location /iidp/ {
            alias      dist/;
            index      index.html;
            try_files  $uri $uri/ /iidp/index.html;
            add_header Cache-Control "no-cache, no-store";
        }

        # ---------- 站点级静态目录 ----------
        # 前端按 /umdComps/、/config/ 等绝对路径引用，必须单独映射，
        # 否则会命中上面的 SPA 回退，返回 index.html，表现为功能按钮无响应。
        location /umdComps/ {
            root dist/views;          # dist/views/umdComps/...
            add_header Cache-Control "no-cache";
        }
        location /config/ {
            root dist;                # dist/config/...
            add_header Cache-Control "no-cache";
        }
        location /resource/ {
            root dist;
        }
        location /static-resource/ {
            root dist;
        }
        location /views/ {
            root dist;
        }
        location /model-views/ {
            root dist;
        }

        # ---------- 反向代理：后端引擎 ----------
        # /api/xxx -> 后端 /xxx（proxy_pass 结尾的 / 会剥掉 /api 前缀）
        location /api/ {
            proxy_pass         http://127.0.0.1:8061/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # ---------- 反向代理：授权服务 ----------
        location /register/ {
            proxy_pass       http://127.0.0.1:8080/;
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ---------- 反向代理：文件服务 ----------
        location /fileSystem/ {
            proxy_pass       http://127.0.0.1:8061/fileSystem/;
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ---------- 引擎消息推送 websocket ----------
        location /ws {
            proxy_pass         http://127.0.0.1:8061/ws;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
            proxy_read_timeout 3600s;
        }
    }
}
