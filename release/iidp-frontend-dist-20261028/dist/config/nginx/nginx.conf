# For more information on configuration, see:
#   * Official English Documentation: http://nginx.org/en/docs/
#   * Official Russian Documentation: http://nginx.org/ru/docs/

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log;

# Load dynamic modules. See /usr/share/doc/nginx/README.dynamic.
include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

http {
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 4096;

    include             /etc/nginx/mime.types;
    default_type        application/octet-stream;

    # Load modular configuration files from the /etc/nginx/conf.d directory.
    # See http://nginx.org/en/docs/ngx_core_module.html#include
    # for more information.
    include /etc/nginx/conf.d/*.conf;

    server {
		listen       30666;
		server_name  localhost;

    set $basePath "/data/web/snest/";

		location /snest {
        alias $basePath;
        index  index.html index.htm;
        if (!-e $request_filename) {
          rewrite ^/(.*) /snest/index.html last;
          break;
        }
      if ($request_filename ~* .*\.(?:htm|html)$) {
        add_header Cache-Control "no-cache, no-store";
      }
      add_header Access-Control-Allow-Origin *;
      add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS';

      # 开启gzip
      gzip on;
      gzip_http_version 1.0;
      gzip_comp_level 6;
      gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;
      gzip_vary on;
      gzip_disable "MSIE [1-6]\.";
    }

    location /iidp/ {
			alias $basePath;
			index  index.html index.htm;
      if (!-e $request_filename) {
			  rewrite ^/(.*) /iidp/index.html last;
        break;
			}
		  if ($request_filename ~* .*\.(?:htm|html)$) {
			add_header Cache-Control "no-cache, no-store";
		  }
      add_header Access-Control-Allow-Origin *;
      add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS';

      # 开启gzip
      gzip on;
      gzip_http_version 1.0;
      gzip_comp_level 6;
      gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;
      gzip_vary on;
      gzip_disable "MSIE [1-6]\.";
		}
    
    location ^~/docs {
      if ($request_filename ~* .*\.(?:htm|html)$) {
        add_header Cache-Control "no-cache, no-store";
      }
      set $curPath "${basePath}docs/";
      alias $curPath;
      add_header Access-Control-Allow-Origin *;
      add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS';
    }
    location /config {
        set $curPath "${basePath}config/";
        alias $curPath;
        index index.html index.htm;
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS';
    }
    location /umdComps {
        set $curPath "${basePath}umdComps/";
        alias $curPath;
        index index.html index.htm;
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS';
        
        # 开启gzip
        gzip on;
        gzip_http_version 1.0;
        gzip_comp_level 6;
        gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;
        gzip_vary on;
        gzip_disable "MSIE [1-6]\.";
    }
    location /static-resource {
      set $curPath "${basePath}static-resource/";
      alias $curPath;
      index index.html index.htm;
      add_header Access-Control-Allow-Origin *;
      add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS';
    }
    location /views {
      set $curPath "${basePath}views/";
      alias $curPath;
      index index.html index.htm;
      add_header Access-Control-Allow-Origin *;
      add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS';
    }
    location /resource {
      set $curPath "${basePath}resource/";
      alias $curPath;
      index index.html index.htm;
      add_header Access-Control-Allow-Origin *;
      add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS';
    }
    location ^~/fileSystem/ {
      proxy_http_version 1.1;
      client_max_body_size 200m;  
      proxy_pass http://192.168.175.54:9000/;
    }
    location ^~/api/ {
      proxy_http_version 1.1;	  
      client_max_body_size 200m;
      proxy_pass http://192.168.168.176:9778/;
    }

  }
}

